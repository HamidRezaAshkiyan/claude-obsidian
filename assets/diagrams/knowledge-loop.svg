<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" role="img" viewBox="0 0 900 610"><title id="title">The claude-obsidian knowledge loop</title><desc id="description">A four-stage loop moves sources through capture, grounding, connection, and use while preserving evidence.</desc><defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f6eadd"/><stop offset=".58" stop-color="#fbf4ec"/><stop offset="1" stop-color="#fff9f2"/></linearGradient><linearGradient id="accent" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#e9823c"/><stop offset="1" stop-color="#6630b8"/></linearGradient><marker id="arrow" markerHeight="9" markerWidth="9" orient="auto" refX="8" refY="4.5"><path fill="#6630b8" d="M0 0 9 4.5 0 9Z"/></marker><filter id="cardShadow" width="124%" height="146%" x="-12%" y="-18%"><feDropShadow dx="0" dy="8" flood-color="#4d372b" flood-opacity=".1" stdDeviation="10"/></filter></defs><style>@keyframes pulse{0%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}@keyframes drift{0%{transform:translateY(0)}50%{transform:translateY(-4px)}}text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.card{animation:rise .9s cubic-bezier(.2,.75,.25,1) both;transform-box:fill-box;transform-origin:center}.card-2{animation-delay:.14s}.card-3{animation-delay:.28s}.card-4{animation-delay:.42s}.flow{stroke-dasharray:7 10;animation:travel 10s linear infinite}.constellation,.pulse{transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 4.2s ease-in-out infinite}.constellation{animation:drift 9s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.card,.constellation,.flow,.pulse{animation:none}}</style><rect width="900" height="610" fill="url(#background)" rx="24"/><g fill="none" stroke="#dfc8b4" stroke-width="1.2" class="constellation" opacity=".62"><path d="M731 44L772 25 819 54 856 29"/><circle cx="731" cy="44" r="4" fill="#ee975a" stroke="none"/><circle cx="772" cy="25" r="3.5" fill="#f5caa8" stroke="none"/><circle cx="819" cy="54" r="4" fill="#d9a2f4" stroke="none"/><circle cx="856" cy="29" r="3" fill="#883aee" stroke="none"/></g><text x="42" y="44" fill="#a94f1b" font-size="14" font-weight="750" letter-spacing="2.2">THE COMPOUNDING LOOP</text><text x="42" y="82" fill="#403b48" font-size="29" font-weight="720">From source material to usable knowledge</text><text x="42" y="112" fill="#6f6873" font-size="17">Four clear stages. One traceable path back to the evidence.</text><path fill="none" stroke="#6630b8" stroke-width="2.3" marker-end="url(#arrow)" d="M432 236H468" class="flow"/><path fill="none" stroke="#6630b8" stroke-width="2.3" marker-end="url(#arrow)" d="M663 336V382" class="flow"/><path fill="none" stroke="#6630b8" stroke-width="2.3" marker-end="url(#arrow)" d="M468 482H432" class="flow"/><path fill="none" stroke="#e9823c" stroke-width="2.3" marker-end="url(#arrow)" d="M237 382V336" class="flow"/><g class="card card-1"><rect width="390" height="200" x="42" y="136" fill="#fff9f4" stroke="#dfc8b4" filter="url(#cardShadow)" rx="18"/><rect width="390" height="5" x="42" y="136" fill="#e9823c" rx="2.5"/><circle cx="78" cy="178" r="20" fill="#e9823c" opacity=".16"/><text x="78" y="184" fill="#a94f1b" font-size="15" font-weight="750" text-anchor="middle">01</text><text x="110" y="185" fill="#403b48" font-size="21" font-weight="720">CAPTURE</text><text x="68" y="225" fill="#403b48" font-size="19" font-weight="650">Bring sources in</text><text x="68" y="258" fill="#6f6873" font-size="17">Visible inbox · local files</text><text x="68" y="287" fill="#6f6873" font-size="17">Approved external runners</text><rect width="146" height="30" x="260" y="292" fill="#fff1e7" stroke="#e8c2a4" rx="15"/><circle cx="282" cy="307" r="4" fill="#e9823c"/><text x="296" y="312" fill="#6b4939" font-size="13.5">explicit intake</text></g><g class="card card-2"><rect width="390" height="200" x="468" y="136" fill="#fff9f4" stroke="#dfc8b4" filter="url(#cardShadow)" rx="18"/><rect width="390" height="5" x="468" y="136" fill="#ee975a" rx="2.5"/><circle cx="504" cy="178" r="20" fill="#e9823c" opacity=".16"/><text x="504" y="184" fill="#a94f1b" font-size="15" font-weight="750" text-anchor="middle">02</text><text x="536" y="185" fill="#403b48" font-size="21" font-weight="720">GROUND</text><text x="494" y="225" fill="#403b48" font-size="19" font-weight="650">Keep the evidence</text><text x="494" y="258" fill="#6f6873" font-size="17">Immutable source copy</text><text x="494" y="287" fill="#6f6873" font-size="17">Source + claim ledgers</text><rect width="146" height="30" x="686" y="292" fill="#fff1e7" stroke="#e8c2a4" rx="15"/><circle cx="708" cy="307" r="4" fill="#ee975a"/><text x="722" y="312" fill="#6b4939" font-size="13.5">traceable claims</text></g><g class="card card-3"><rect width="390" height="200" x="468" y="382" fill="#fcf9ff" stroke="#d4b7f2" filter="url(#cardShadow)" rx="18"/><rect width="390" height="5" x="468" y="382" fill="#883aee" rx="2.5"/><circle cx="504" cy="424" r="20" fill="#6630b8" opacity=".2"/><text x="504" y="430" fill="#6630b8" font-size="15" font-weight="750" text-anchor="middle">03</text><text x="536" y="431" fill="#403b48" font-size="21" font-weight="720">CONNECT</text><text x="494" y="471" fill="#403b48" font-size="19" font-weight="650">Build the wiki</text><text x="494" y="504" fill="#6f6873" font-size="17">Linked pages · indexes · Canvas</text><text x="494" y="533" fill="#6f6873" font-size="17">Methodology-aware structure</text><rect width="154" height="30" x="678" y="538" fill="#f3eaff" stroke="#d4b7f2" rx="15"/><circle cx="700" cy="553" r="4" fill="#883aee"/><text x="714" y="558" fill="#5c2ead" font-size="13.5">connected context</text></g><g class="card card-4"><rect width="390" height="200" x="42" y="382" fill="#fcf9ff" stroke="#d4b7f2" filter="url(#cardShadow)" rx="18"/><rect width="390" height="5" x="42" y="382" fill="#6630b8" rx="2.5"/><circle cx="78" cy="424" r="20" fill="#6630b8" opacity=".2"/><text x="78" y="430" fill="#6630b8" font-size="15" font-weight="750" text-anchor="middle">04</text><text x="110" y="431" fill="#403b48" font-size="21" font-weight="720">USE</text><text x="68" y="471" fill="#403b48" font-size="19" font-weight="650">Put knowledge to work</text><text x="68" y="504" fill="#6f6873" font-size="17">Grounded answers · bounded research</text><text x="68" y="533" fill="#6f6873" font-size="17">Lint · retrieve · fold</text><rect width="154" height="30" x="252" y="538" fill="#f3eaff" stroke="#d4b7f2" rx="15"/><circle cx="274" cy="553" r="4" fill="#6630b8"/><text x="288" y="558" fill="#5c2ead" font-size="13.5">evidence-led output</text></g><rect width="340" height="32" x="280" y="343" fill="#fff9f4" stroke="url(#accent)" rx="16"/><circle cx="306" cy="359" r="4.5" fill="#e9823c" class="pulse"/><text x="321" y="365" fill="#534e59" font-size="14" font-weight="620">reviewed knowledge feeds the next use</text></svg>